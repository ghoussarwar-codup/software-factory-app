name: Factory baseline evidence

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  baseline:
    if: github.event.pull_request.number == 1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: c1eac0d22eaaed73e2fbf11bcac3e9c4bca5ba25
          path: baseline
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned baseline dependencies
        working-directory: baseline
        run: npm ci
      - name: Run unchanged upstream suite once
        working-directory: baseline
        run: |
          test "$(git rev-parse HEAD)" = c1eac0d22eaaed73e2fbf11bcac3e9c4bca5ba25
          exit_code=0
          node --test --test-timeout 60000 --test-reporter ../candidate/tools/factory-baseline-reporter.cjs 'test/*.test.cjs' > "$RUNNER_TEMP/factory-ubuntu.jsonl" || exit_code=$?
          test "$exit_code" -le 1
          test -s "$RUNNER_TEMP/factory-ubuntu.jsonl"
      - name: Capture legacy standalone test results
        working-directory: baseline
        run: |
          for file in agent-provider slack-stop-persist restart-terminal-preserve; do
            exit_code=0
            timeout 30s node "test/$file.test.cjs" > "$RUNNER_TEMP/factory-legacy-$file.txt" 2>&1 || exit_code=$?
            test "$exit_code" -le 1
          done
      - name: Exercise original assertions without the shared TypeScript loader
        working-directory: baseline
        run: bash ../candidate/tools/factory-baseline-native-proof.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: factory-linux-baseline
          path: |
            ${{ runner.temp }}/factory-ubuntu.jsonl
            ${{ runner.temp }}/factory-native-proof.jsonl
            ${{ runner.temp }}/factory-legacy-*.txt
          if-no-files-found: error
