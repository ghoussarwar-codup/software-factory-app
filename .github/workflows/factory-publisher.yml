name: Factory publisher split bootstrap

on:
  push:
    branches: [bootstrap/publisher]
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: factory-publisher
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.repository == 'ghoussarwar-codup/software-factory-app' &&
      github.event_name == 'push' && github.ref == 'refs/heads/bootstrap/publisher'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: publisher
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate candidate and base
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          base=2f97b7b802c6cdaebcb1b39c7a9c60a597f7d39b
          candidate=e9c04c60351ea03c41aed65954b0330dfb961572
          tree=ecfe3d3fb26d8dfe5a6b84e8e4ce3dee31dab6c1
          branch=bot/factory-publisher-split
          git fetch --no-tags --depth=1 origin refs/heads/main
          [[ "$(git rev-parse FETCH_HEAD)" == "$base" ]]
          git fetch --no-tags --depth=2 origin "$candidate"
          [[ "$(git rev-parse FETCH_HEAD)" == "$candidate" ]]
          [[ "$(git rev-parse "$candidate^")" == "$base" ]]
          [[ "$(git rev-parse "$candidate^{tree}")" == "$tree" ]]
          expected=$'D\t.github/workflows/contributor-role.yml\nD\t.github/workflows/contributors.yml\nM\t.github/workflows/factory-publisher.yml'
          [[ "$(git diff --name-status "$base" "$candidate")" == "$expected" ]]
          {
            printf 'base=%s\n' "$base"
            printf 'tree=%s\n' "$tree"
            printf 'branch=%s\n' "$branch"
          } >> "$GITHUB_OUTPUT"

      - name: Create repository-scoped installation token
        id: app
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc
        with:
          app-id: ${{ vars.FACTORY_APP_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: software-factory-app
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Publish verified tree and open pull request
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          INSTALLATION_ID: ${{ steps.app.outputs.installation-id }}
          REVIEWED_BASE: ${{ steps.candidate.outputs.base }}
          REVIEWED_TREE: ${{ steps.candidate.outputs.tree }}
          BOT_BRANCH: ${{ steps.candidate.outputs.branch }}
        run: |
          set -euo pipefail
          repository="$GITHUB_REPOSITORY"
          [[ "$INSTALLATION_ID" == 186401597 ]]
          bot='codup-software-factory-bot[bot]'
          bot_id=$(gh api "users/$bot" --jq .id)
          ref="refs/heads/$BOT_BRANCH"
          current_main() {
            git ls-remote origin refs/heads/main | cut -f1
          }
          [[ "$(current_main)" == "$REVIEWED_BASE" ]]
          old_tip=$(git ls-remote origin "$ref" | cut -f1)
          parents=(-p "$REVIEWED_BASE")
          if [[ -n "$old_tip" && "$old_tip" != "$REVIEWED_BASE" ]]; then
            git fetch --no-tags --depth=1 origin "$ref"
            [[ "$(git rev-parse FETCH_HEAD)" == "$old_tip" ]]
            parents+=(-p "$old_tip")
          fi
          commit=$(git -c "user.name=$bot" -c "user.email=$bot_id+$bot@users.noreply.github.com" \
            commit-tree "$REVIEWED_TREE" "${parents[@]}" -m 'Publish reviewed Factory candidate')
          [[ "$(git rev-parse "$commit^{tree}")" == "$REVIEWED_TREE" ]]
          [[ "$(git rev-parse "$commit^")" == "$REVIEWED_BASE" ]]

          # Pass the token to Git through an ephemeral askpass child process.
          askpass=$(mktemp)
          trap 'rm -f "$askpass"' EXIT
          printf '%s\n' '#!/bin/sh' 'case "$1" in *Username*) printf "%s\n" x-access-token ;; *) printf "%s\n" "$GH_TOKEN" ;; esac' > "$askpass"
          chmod 700 "$askpass"
          [[ "$(current_main)" == "$REVIEWED_BASE" ]]
          GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 git -c credential.helper= push origin "$commit:$ref"
          [[ "$(git ls-remote origin "$ref" | cut -f1)" == "$commit" ]]
          [[ "$(current_main)" == "$REVIEWED_BASE" ]]

          number=$(gh api --method GET "repos/$repository/pulls" -f state=open -f "head=${repository%/*}:$BOT_BRANCH" -f base=main --jq '.[0].number // empty')
          if [[ -z "$number" ]]; then
            title='Publish reviewed Factory candidate'
            body="Published by the Factory GitHub App from a reviewed tree. Base: $REVIEWED_BASE. Tree: $REVIEWED_TREE."
            if [[ "$GITHUB_EVENT_NAME" == push ]]; then
              title='Split routine and protected workflow publication'
              body="$body

          Routine publication runs from main with its own Contents and Pull requests-only app. Workflow changes require the existing protected publisher environment and temporary Workflows write. Bot PR branches are single-use. The inherited contributor workflows are removed: attribution remains in Git history and CONTRIBUTORS.md, and the upstream Discord role has no Factory requirement."
            fi
            number=$(gh api --method POST "repos/$repository/pulls" -f "head=$BOT_BRANCH" -f base=main -f "title=$title" -f "body=$body" --jq .number)
          fi
          pr=$(gh api "repos/$repository/pulls/$number")
          [[ "$(jq -r .user.login <<< "$pr")" == "$bot" ]]
          [[ "$(jq -r .head.sha <<< "$pr")" == "$commit" ]]
          [[ "$(jq -r .base.sha <<< "$pr")" == "$REVIEWED_BASE" ]]
          {
            printf 'Bot push and PR author: %s\n\n' "$bot"
            printf 'PR: %s\n\n' "$(jq -r .html_url <<< "$pr")"
            printf 'Published commit: %s\n' "$commit"
          } >> "$GITHUB_STEP_SUMMARY"
