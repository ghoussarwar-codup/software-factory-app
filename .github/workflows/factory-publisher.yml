name: Factory publisher

on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Commit SHA of the reviewed candidate
        required: true
        type: string
      tree:
        description: Tree SHA approved for publication
        required: true
        type: string
      branch:
        description: Bot branch (bot/<name>)
        required: true
        type: string

      workflow_change:
        description: Use the protected workflow-change publisher
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: factory-publisher
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.repository == 'ghoussarwar-codup/software-factory-app' &&
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.workflow_change && 'publisher' || 'publisher-routine' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate candidate and base
        id: candidate
        shell: bash
        env:
          WORKFLOW_CHANGE: ${{ inputs.workflow_change }}
          REQUESTED_CANDIDATE: ${{ inputs.candidate }}
          REQUESTED_TREE: ${{ inputs.tree }}
          REQUESTED_BRANCH: ${{ inputs.branch }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin refs/heads/main
          base=$(git rev-parse FETCH_HEAD)
          candidate="$REQUESTED_CANDIDATE"
          tree="$REQUESTED_TREE"
          branch="$REQUESTED_BRANCH"

          [[ "$candidate" =~ ^[0-9a-f]{40}$ && "$tree" =~ ^[0-9a-f]{40}$ ]]
          [[ "$branch" =~ ^bot/[a-z0-9][a-z0-9-]{0,60}$ ]]
          git check-ref-format "refs/heads/$branch"
          git fetch --no-tags --depth=2 origin "$candidate"
          [[ "$(git rev-parse FETCH_HEAD)" == "$candidate" ]]
          [[ "$(git rev-parse "$candidate^{tree}")" == "$tree" ]]
          [[ "$(git rev-parse "$candidate^")" == "$base" ]]
          if git diff --quiet "$base" "$candidate" -- .github/workflows; then
            if [[ "$WORKFLOW_CHANGE" == true ]]; then
              echo 'Use routine publication for a candidate without workflow changes.' >&2
              exit 1
            fi
          elif [[ "$WORKFLOW_CHANGE" != true ]]; then
            echo 'Workflow changes require the protected publisher environment.' >&2
            exit 1
          fi
          {
            printf 'base=%s\n' "$base"
            printf 'tree=%s\n' "$tree"
            printf 'branch=%s\n' "$branch"
          } >> "$GITHUB_OUTPUT"

      - name: Create repository-scoped installation token
        id: app
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc
        with:
          app-id: ${{ vars.FACTORY_APP_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: software-factory-app
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: ${{ inputs.workflow_change && 'write' || '' }}

      - name: Publish verified tree and open pull request
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          INSTALLATION_ID: ${{ steps.app.outputs.installation-id }}
          EXPECTED_INSTALLATION: ${{ inputs.workflow_change && '186401597' || vars.FACTORY_APP_INSTALLATION_ID }}
          BOT_LOGIN: ${{ inputs.workflow_change && 'codup-software-factory-bot[bot]' || vars.FACTORY_APP_BOT_LOGIN }}
          REVIEWED_BASE: ${{ steps.candidate.outputs.base }}
          REVIEWED_TREE: ${{ steps.candidate.outputs.tree }}
          BOT_BRANCH: ${{ steps.candidate.outputs.branch }}
        run: |
          set -euo pipefail
          repository="$GITHUB_REPOSITORY"
          [[ "$EXPECTED_INSTALLATION" =~ ^[0-9]+$ && "$INSTALLATION_ID" == "$EXPECTED_INSTALLATION" ]]
          bot="$BOT_LOGIN"
          [[ "$bot" =~ ^[a-zA-Z0-9-]+\[bot\]$ ]]
          bot_id=$(gh api "users/$bot" --jq .id)
          ref="refs/heads/$BOT_BRANCH"
          current_main() {
            git ls-remote origin refs/heads/main | cut -f1
          }
          [[ "$(current_main)" == "$REVIEWED_BASE" ]]
          if [[ -n "$(git ls-remote origin "$ref")" ]]; then
            echo 'Bot PR branches are single-use. Publish a fresh branch for a refreshed candidate.' >&2
            exit 1
          fi
          commit=$(git -c "user.name=$bot" -c "user.email=$bot_id+$bot@users.noreply.github.com" \
            commit-tree "$REVIEWED_TREE" -p "$REVIEWED_BASE" -m 'Publish reviewed Factory candidate')
          [[ "$(git rev-parse "$commit^{tree}")" == "$REVIEWED_TREE" ]]
          [[ "$(git rev-parse "$commit^")" == "$REVIEWED_BASE" ]]

          # Pass the token to Git through an ephemeral askpass child process.
          askpass=$(mktemp)
          trap 'rm -f "$askpass"' EXIT
          printf '%s\n' '#!/bin/sh' 'case "$1" in *Username*) printf "%s\n" x-access-token ;; *) printf "%s\n" "$GH_TOKEN" ;; esac' > "$askpass"
          chmod 700 "$askpass"
          [[ "$(current_main)" == "$REVIEWED_BASE" ]]
          GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 git -c credential.helper= push origin "$commit:$ref"
          [[ "$(git ls-remote origin "$ref" | cut -f1)" == "$commit" ]]
          [[ "$(current_main)" == "$REVIEWED_BASE" ]]

          title='Publish reviewed Factory candidate'
          body="Published by the Factory GitHub App from a reviewed tree. Base: $REVIEWED_BASE. Tree: $REVIEWED_TREE."
          number=$(gh api --method POST "repos/$repository/pulls" -f "head=$BOT_BRANCH" -f base=main -f "title=$title" -f "body=$body" --jq .number)
          pr=$(gh api "repos/$repository/pulls/$number")
          [[ "$(jq -r .user.login <<< "$pr")" == "$bot" ]]
          [[ "$(jq -r .head.sha <<< "$pr")" == "$commit" ]]
          [[ "$(jq -r .base.sha <<< "$pr")" == "$REVIEWED_BASE" ]]
          {
            printf 'Bot push and PR author: %s\n\n' "$bot"
            printf 'PR: %s\n\n' "$(jq -r .html_url <<< "$pr")"
            printf 'Published commit: %s\n' "$commit"
          } >> "$GITHUB_STEP_SUMMARY"
