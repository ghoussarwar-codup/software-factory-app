name: Factory CI

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: factory-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: Factory CI - ${{ matrix.candidate }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - candidate: PR head
            sha: ${{ github.event.pull_request.head.sha }}
          - candidate: Combined commit
            sha: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.sha }}
          persist-credentials: false
      - name: Verify checked-out commit
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ matrix.sha }}
        run: |
          $actual = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $actual -ne $env:EXPECTED_SHA) {
            throw 'Checked-out commit does not match the expected candidate.'
          }
          Write-Host "Testing commit $actual"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and integration tests
        run: npm run test:focused

  baseline-evidence:
    name: Factory baseline evidence
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: c1eac0d22eaaed73e2fbf11bcac3e9c4bca5ba25
          path: baseline
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install unchanged baseline dependencies
        working-directory: baseline
        run: npm ci
      - name: Record unchanged baseline test failures
        working-directory: baseline
        shell: pwsh
        run: |
          $sha = git rev-parse HEAD
          if ($sha -ne 'c1eac0d22eaaed73e2fbf11bcac3e9c4bca5ba25') {
            throw 'Baseline checkout does not match the pinned commit.'
          }
          $reporter = Join-Path $env:GITHUB_WORKSPACE 'candidate/tools/factory-baseline-reporter.cjs'
          node --test --test-reporter $reporter 'test/*.test.cjs' |
            Set-Content -Encoding utf8 "${env:RUNNER_TEMP}/factory-baseline-failures.jsonl"
          $testExit = $LASTEXITCODE
          if ($testExit -gt 1) { exit $testExit }
          if ($testExit -eq 1 -and !(Get-Content "${env:RUNNER_TEMP}/factory-baseline-failures.jsonl" -TotalCount 1)) {
            throw 'Baseline test run failed without structured failure records.'
          }
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: factory-baseline-failures
          path: ${{ runner.temp }}/factory-baseline-failures.jsonl
          if-no-files-found: error
