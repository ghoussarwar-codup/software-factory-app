name: Factory CI

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: factory-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: Factory CI - ${{ matrix.candidate }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - candidate: PR head
            sha: ${{ github.event.pull_request.head.sha }}
          - candidate: Combined commit
            sha: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.sha }}
          persist-credentials: false
      - name: Verify checked-out commit
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ matrix.sha }}
        run: |
          $actual = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $actual -ne $env:EXPECTED_SHA) {
            throw 'Checked-out commit does not match the expected candidate.'
          }
          Write-Host "Testing commit $actual"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and integration tests
        run: npm run test:focused
